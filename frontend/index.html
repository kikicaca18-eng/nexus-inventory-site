<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>kt m&s H.O.S</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">kt m&s H.O.S</div>
      <div class="brand-sub" id="brandSub">HoNam Operation System</div>
    </div>

    <button class="btn ghost" id="logoutBtn" onclick="logout()" style="display:none;">
      로그아웃
    </button>
  </header>

  <main class="container">
    <section class="hero">
      <h1>kt m&s H.O.S</h1>
      <p>
        HoNam Operation System<br/>
        재고를 빠르고 정확하게 조회하세요.
      </p>
    </section>

    <!-- 로그인 -->
    <section class="card" id="loginBox">
      <h2 class="h2">센터 로그인</h2>

      <label class="label">센터</label>
      <select id="centerSelect" class="input">
        <option value="">센터 선택</option>
        <option value="광주">광주</option>
        <option value="목포">목포</option>
        <option value="순천">순천</option>
        <option value="전북">전북</option>
        <option value="제주">제주</option>
        <option value="관리자">관리자(업로드)</option>
      </select>

      <label class="label">비밀번호</label>
      <input type="password" id="password" class="input" placeholder="비밀번호 입력" />

      <button class="btn primary" onclick="login()">로그인</button>
    </section>

    <!-- 검색 -->
    <section class="card" id="searchBox" style="display:none;">
      <h2 class="h2">재고 검색</h2>

      <div class="status" id="lastUploadBox">
        마지막 업로드: -
      </div>

      <div class="grid">
        <input id="model" class="input" placeholder="모델" />
        <input id="address" class="input" placeholder="상권주소" />
        <input id="owner" class="input" placeholder="보유처" />
        <input id="nickname" class="input" placeholder="애칭" />
      </div>

      <div class="actions">
        <button class="btn primary" onclick="runSearch()">조회</button>
      </div>

      <div class="status" id="status"></div>
      <div id="result"></div>
    </section>

    <!-- 업로드 -->
    <section class="card" id="uploadBox" style="display:none;">
      <h2 class="h2">엑셀 업로드 (관리자)</h2>

      <input type="file" id="excelFile" class="input" accept=".xlsx,.xls" />
      <button class="btn primary" id="uploadBtn" onclick="uploadExcel()">업로드</button>

      <div class="status" id="uploadStatus"></div>
    </section>
  </main>

  <!-- ✅ JS는 script.js 하나만 -->
  <script src="script.js"></script>
</body>
</html>
