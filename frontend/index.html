<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>kt m&s H.O.S</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">kt m&s H.O.S</div>

      <!-- ✅ 중요: script.js가 쓰는 brandSub id 복구 -->
      <div class="brand-sub" id="brandSub">HoNam Operation System</div>
    </div>

    <button class="btn ghost" id="logoutBtn" onclick="logout()" style="display:none;">
      로그아웃
    </button>
  </header>

  <main class="container">
    <section class="hero">
      <h1>kt m&s H.O.S</h1>
      <p>
        HoNam Operation System<br/>
        재고를 빠르고 정확하게 조회하세요.
      </p>
    </section>

    <!-- 로그인 -->
    <section class="card" id="loginBox">
      <h2 class="h2">센터 로그인</h2>

      <label class="label">센터</label>
      <select id="centerSelect" class="input">
        <option value="">센터 선택</option>
        <option value="광주">광주</option>
        <option value="목포">목포</option>
        <option value="순천">순천</option>
        <option value="전북">전북</option>
        <option value="제주">제주</option>
        <option value="관리자">관리자(업로드)</option>
      </select>

      <label class="label">비밀번호</label>
      <input type="password" id="password" class="input" placeholder="비밀번호 입력" />

      <button class="btn primary" onclick="login()">로그인</button>
    </section>

    <!-- 검색 -->
    <section class="card" id="searchBox" style="display:none;">
      <h2 class="h2">재고 검색</h2>

      <!-- 🔥 마지막 업로드 시각 표시 -->
      <div class="status" id="lastUploadBox">
        마지막 업로드: 불러오는 중...
      </div>

      <div class="grid">
        <div>
          <label class="label">모델(선택)</label>
          <input id="model" class="input" placeholder="예: M366 / 갤25 / S931" />
        </div>
        <div>
          <label class="label">상권주소(선택)</label>
          <input id="address" class="input" placeholder="예: 군산 / 광주 / 순천 ..." />
        </div>
        <div>
          <label class="label">보유처(선택)</label>
          <input id="owner" class="input" placeholder="예: OO대리점 / 판매점명" />
        </div>
        <div>
          <label class="label">애칭(선택)</label>
          <input id="nickname" class="input" placeholder="예: 홍길동" />
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" onclick="runSearch()">조회</button>

        <select id="sortKey" class="input small">
          <option value="보유처">보유처</option>
          <option value="모델명">모델명</option>
          <option value="색상">색상</option>
        </select>

        <select id="sortOrder" class="input small">
          <option value="asc">오름차순</option>
          <option value="desc">내림차순</option>
        </select>

        <label class="check">
          <input type="checkbox" id="detailToggle" />
          상세 보기
        </label>
      </div>

      <div class="status" id="status"></div>
      <div id="result"></div>
    </section>

    <!-- 업로드 (관리자) -->
    <section class="card" id="uploadBox" style="display:none;">
      <h2 class="h2">엑셀 업로드 (관리자)</h2>
      <p class="muted">
        매일 아침 최신 엑셀을 업로드하면<br/>
        서버 재고 데이터가 즉시 갱신됩니다.
      </p>

      <input
        type="file"
        id="excelFile"
        class="input"
        accept=".xlsx,.xls"
        onchange="onExcelSelect()"
      />

      <button
        class="btn primary"
        id="uploadBtn"
        onclick="uploadExcel()"
        disabled
      >
        업로드
      </button>

      <div class="status" id="uploadStatus"></div>
    </section>
  </main>

  <script src="script.js"></script>

  <!-- 🔥 업로드 + 마지막 업로드 조회 로직 -->
  <script>
    const API_BASE = "http://localhost:3000"; // Render 배포 시 변경

    function onExcelSelect() {
      const fileInput = document.getElementById("excelFile");
      const uploadBtn = document.getElementById("uploadBtn");
      const status = document.getElementById("uploadStatus");

      if (fileInput.files.length > 0) {
        uploadBtn.disabled = false;
        status.textContent = `선택된 파일: ${fileInput.files[0].name}`;
      } else {
        uploadBtn.disabled = true;
        status.textContent = "";
      }
    }

    async function uploadExcel() {
      const fileInput = document.getElementById("excelFile");
      const status = document.getElementById("uploadStatus");

      if (!fileInput.files.length) {
        alert("엑셀 파일을 선택하세요.");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      status.textContent = "업로드 중...";

      try {
        const res = await fetch(API_BASE + "/upload", {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (!data.ok) {
          status.textContent = "❌ 업로드 실패";
          return;
        }

        status.textContent = `✅ 업로드 완료 (${data.count.toLocaleString()}건)`;

        loadUploadStatus();
      } catch (e) {
        status.textContent = "❌ 서버 연결 오류";
      }
    }

    async function loadUploadStatus() {
      try {
        const res = await fetch(API_BASE + "/upload-status");
        const data = await res.json();

        const box = document.getElementById("lastUploadBox");
        if (!box) return;

        if (!data.lastUpload) {
          box.textContent = "마지막 업로드: 없음";
          return;
        }

        const { uploaded_at_kst, row_count, filename } = data.lastUpload;
        box.textContent =
          `마지막 업로드: ${uploaded_at_kst} / ${row_count.toLocaleString()}건` +
          (filename ? ` / ${filename}` : "");
      } catch {
        const box = document.getElementById("lastUploadBox");
        if (box) box.textContent = "마지막 업로드: 조회 실패";
      }
    }

    loadUploadStatus();
  </script>
</body>
</html>
