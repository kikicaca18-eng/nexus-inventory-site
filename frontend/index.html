<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>kt m&s H.O.S</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">kt m&s H.O.S</div>
      <div class="brand-sub" id="brandSub">HoNam Operation System</div>
    </div>

    <button
      class="btn ghost"
      id="logoutBtn"
      onclick="logout()"
      style="display:none;"
    >
      로그아웃
    </button>
  </header>

  <main class="container">
    <section class="hero">
      <h1>kt m&s H.O.S</h1>
      <p>
        HoNam Operation System<br/>
        재고를 빠르고 정확하게 조회하세요.
      </p>
    </section>

    <!-- ================= 로그인 ================= -->
    <section class="card" id="loginBox">
      <h2 class="h2">센터 로그인</h2>

      <label class="label">센터</label>
      <select id="centerSelect" class="input">
        <option value="">센터 선택</option>
        <option value="광주">광주</option>
        <option value="목포">목포</option>
        <option value="순천">순천</option>
        <option value="전북">전북</option>
        <option value="제주">제주</option>
        <option value="관리자">관리자(업로드)</option>
      </select>

      <label class="label">비밀번호</label>
      <input
        type="password"
        id="password"
        class="input"
        placeholder="비밀번호 입력"
      />

      <button class="btn primary" onclick="login()">로그인</button>
    </section>

    <!-- ================= 재고 검색 (유일) ================= -->
    <section class="card" id="searchBox" style="display:none;">
      <h2 class="h2">재고 검색</h2>

      <p class="muted" style="margin-bottom:8px;">
        모델 · 상권주소 · 보유처 · 애칭 중<br/>
        <strong>하나 이상 입력</strong>하면 조회됩니다.
      </p>

      <div class="grid">
        <div>
          <label class="label">모델 (선택)</label>
          <input id="model" class="input" placeholder="예: M366 / 갤25 / S931" />
        </div>

        <div>
          <label class="label">상권주소 (선택)</label>
          <input id="address" class="input" placeholder="예: 군산 / 광주" />
        </div>

        <div>
          <label class="label">보유처 (선택)</label>
          <input id="owner" class="input" placeholder="예: OO대리점" />
        </div>

        <div>
          <label class="label">애칭 (선택)</label>
          <input id="nickname" class="input" placeholder="예: 홍길동" />
        </div>
      </div>

      <div class="actions mobile-actions">
        <button type="button" class="btn primary" onclick="runSearch()">조회</button>

        <select id="sortKey" class="input small">
          <option value="보유처">보유처</option>
          <option value="모델명">모델명</option>
          <option value="색상">색상</option>
        </select>

        <select id="sortOrder" class="input small">
          <option value="asc">오름차순</option>
          <option value="desc">내림차순</option>
        </select>

        <label class="check">
          <input type="checkbox" id="detailToggle" />
          상세 보기
        </label>
      </div>

      <div class="status" id="status"></div>
      <div id="result"></div>
    </section>

    <!-- ================= 엑셀 업로드 ================= -->
    <section class="card" id="uploadBox" style="display:none;">
      <h2 class="h2">엑셀 업로드 (관리자)</h2>

      <p class="muted">
        최신 엑셀을 업로드하면<br/>
        서버 재고 데이터가 즉시 갱신됩니다.
      </p>

      <input
        type="file"
        id="excelFile"
        class="input"
        accept=".xlsx,.xls"
      />
      <button
        class="btn primary"
        id="uploadBtn"
        onclick="uploadExcel()"
      >
        업로드
      </button>

      <div class="status" id="uploadStatus"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
